# SonarCloud Automatic Analysis reads this file (no CI scanner runs; sonar-project.properties would be ignored).
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
# Tests are analysed as tests, not as sources. Also not sources: pinned external data, and the API client files that
# `make api-client` generates (frontend/openapi.json, frontend/src/api/schema.d.ts) and `make sdk` generates (the
# Python SDK's pydantic models and the TypeScript SDK's schema types).
sonar.exclusions=backend/tests/**,tools/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,backend/data/**,frontend/openapi.json,frontend/src/api/schema.d.ts,sdk/python/src/snowcrawl_sdk/models.py,sdk/typescript/src/schema.d.ts,sdk/python/tests/**,sdk/typescript/test/**
sonar.test.inclusions=backend/tests/**,tools/tests/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,sdk/python/tests/**,sdk/typescript/test/**
